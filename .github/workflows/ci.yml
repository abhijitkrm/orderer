name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "orderer-spec/*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: the long proofs (8 seeds × 20k, exhaustive depth 3)
  workflow_dispatch:

jobs:
  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the pinned matcher commit, for the upstream-equality half of the check
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher
          path: upstream/matcher
          fetch-depth: 0
      - run: UPSTREAM_DIR=upstream/matcher scripts/vendored.sh

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/manifest.sh

  ordergen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher
          path: upstream/matcher
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path tools/ordergen/Cargo.toml
      - run: cargo build --release --manifest-path upstream/matcher/tools/vectorgen/Cargo.toml
      - run: cargo build --release --manifest-path upstream/matcher/tools/fuzzgen/Cargo.toml
      - name: W1–W5 + fuzz + exhaustive byte-identical to matcher's tools
        run: |
          OG=tools/ordergen/target/release/ordergen
          VG=upstream/matcher/tools/vectorgen/target/release/vectorgen
          FG=upstream/matcher/tools/fuzzgen/target/release/fuzzgen
          for w in w1 w2 w3 w4 w5; do
            $VG --workload $w --n 20000 --out /tmp/vg-$w; $OG --workload $w --n 20000 --out /tmp/og-$w
            cmp /tmp/vg-$w.setup.cmd.jsonl /tmp/og-$w.setup.cmd.jsonl
            cmp /tmp/vg-$w.run.cmd.jsonl /tmp/og-$w.run.cmd.jsonl
          done
          for s in 1 2 3; do cmp <($FG --seed $s --n 5000 --symbols 8 --ids 512) <($OG --seed $s --n 5000 --symbols 8 --ids 512); done
          $FG --exhaustive 2 --out /tmp/fe; $OG --exhaustive 2 --out /tmp/oe; diff -r /tmp/fe /tmp/oe
      - name: W6 deterministic
        run: |
          OG=tools/ordergen/target/release/ordergen
          $OG --workload w6 --symbols 16 --n 50000 --out /tmp/a; $OG --workload w6 --symbols 16 --n 50000 --out /tmp/b
          cmp /tmp/a.run.cmd.jsonl /tmp/b.run.cmd.jsonl && cmp /tmp/a.setup.cmd.jsonl /tmp/b.setup.cmd.jsonl

  # Cross-implementation proofs (scripts/*.sh) over every orderer port and
  # its matcher counterpart. Private sibling repos need secrets.ORDERER_REPO_TOKEN
  # (read access); public ones work with the default token.
  cross-impl:
    runs-on: ubuntu-latest
    env:
      ORDERER_RUST_DIR: ${{ github.workspace }}/impl/orderer-rust
      ORDERER_CPP_DIR: ${{ github.workspace }}/impl/orderer-cpp
      ORDERER_JAVA_DIR: ${{ github.workspace }}/impl/orderer-java
      ORDERER_GO_DIR: ${{ github.workspace }}/impl/orderer-go
      ORDERER_TS_DIR: ${{ github.workspace }}/impl/orderer-ts
      MATCHER_RUST_DIR: ${{ github.workspace }}/impl/matcher-rust
      MATCHER_CPP_DIR: ${{ github.workspace }}/impl/matcher-cpp
      MATCHER_JAVA_DIR: ${{ github.workspace }}/impl/matcher-java
      MATCHER_GO_DIR: ${{ github.workspace }}/impl/matcher-go
      MATCHER_TS_DIR: ${{ github.workspace }}/impl/matcher-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-rust
          path: impl/orderer-rust
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-rust
          ref: 8c4d05ec0474ee3517ad83e017ff7372f4ea7e3d
          path: impl/matcher-rust
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-cpp
          path: impl/orderer-cpp
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-cpp
          ref: 5ddb7d2c2deb2e72b2d9a7fc09e27293bb2511b1
          path: impl/matcher-cpp
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-java
          path: impl/orderer-java
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-java
          ref: 56455ebc30c8e45634a2b62b369739a729418d57
          path: impl/matcher-java
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-go
          path: impl/orderer-go
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-go
          ref: 46852c894e073e721e14202d9360495a91e07cc2
          path: impl/matcher-go
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-ts
          path: impl/orderer-ts
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-ts
          ref: 0ef59a2b822b424fb6656b44f0406d19321b0d27
          path: impl/matcher-ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: (cd impl/orderer-ts && npm ci) && (cd impl/matcher-ts && npm ci)
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/verify.sh
      - run: scripts/diffuzz.sh ${{ github.event_name == 'schedule' && '8 20000' || '4 10000' }}
      - run: scripts/exhaustive.sh ${{ github.event_name == 'schedule' && '3' || '2' }}
      - run: scripts/e2e.sh
      - run: scripts/snapdiff.sh
